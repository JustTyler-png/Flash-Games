<!DOCTYPE html>
<html lang="en" style="margin:0;padding:0;overflow:hidden;width:100%;height:100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruffle Example</title>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body style="margin:0;padding:0;overflow:hidden;width:100%;height:100%;background-color:#000;">
  <div id="ruffle" class="gameloc" style="width:100%;height:100%;"></div> 
  <script>
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    var swfobject = {};
    var isEmbedded = false;

    swfobject.embedSWF = function(url, cont, width, height) {
        if (isEmbedded) return;
        const ruffle = window.RufflePlayer.newest();
        const container = document.getElementById(cont);
        if (!container) {
            console.error("Container element not found");
            return;
        }
        const player = ruffle.createPlayer();
        container.appendChild(player);
        Object.assign(player, {
            width: width,
            height: height
        });
        player.style.width = width + 'px';
        player.style.height = height + 'px';
        player.style.display = 'block';
        player.style.border = 'none';
        player.style.padding = '0';
        player.style.margin = '0';
        player.load({ url: url });
        isEmbedded = true;
    };

    document.addEventListener('DOMContentLoaded', function () {
      swfobject.embedSWF("https://justtyler-png.github.io/Flash-Games/tboi.swf", 'ruffle', viewportWidth, viewportHeight);
    });
  </script>
</body>
</html>
